<!doctype html>
<!-- @dsCard group="Brand" name="Home · Rediseño" subtitle="Rediseño completo con 3 variantes de hero + tweaks" viewport="1280x900" -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usina de Justicia · Home (rediseño)</title>
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root { --maxw: 1200px; }
  html, body { margin:0; padding:0; background:#fff; }
  body.uj-app { color: var(--fg-1); font-family: var(--font-body); }
  * { box-sizing: border-box; }
  [data-lucide] { display: inline-flex; }
  a { color: inherit; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 40px; }
  @media (max-width: 720px) { .wrap { padding: 0 20px; } }

  /* Reveal on scroll */
  .reveal { opacity: 1; transform: none; transition: opacity 500ms var(--ease-out), transform 500ms var(--ease-out); }
  .js-reveal .reveal { opacity: 0; transform: translateY(12px); }
  .js-reveal .reveal.is-in { opacity: 1; transform: none; }
</style>
</head>
<body class="uj-app">
<div id="root"></div>

<script>
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "variant": "editorial",
    "density": "amplio",
    "accentWarm": false,
    "portraits": true
  }/*EDITMODE-END*/;
</script>

<script type="text/babel" src="home/Header.jsx"></script>
<script type="text/babel" src="home/HeroEditorial.jsx"></script>
<script type="text/babel" src="home/HeroAccompany.jsx"></script>
<script type="text/babel" src="home/HeroData.jsx"></script>
<script type="text/babel" src="home/Pillars.jsx"></script>
<script type="text/babel" src="home/QueHacer.jsx"></script>
<script type="text/babel" src="home/Testimonios.jsx"></script>
<script type="text/babel" src="home/Observatorio.jsx"></script>
<script type="text/babel" src="home/Trayectoria.jsx"></script>
<script type="text/babel" src="home/Donar.jsx"></script>
<script type="text/babel" src="home/Footer.jsx"></script>
<script type="text/babel" src="home/Tweaks.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

function App() {
  const [tweaks, setTweaks] = useState(window.TWEAK_DEFAULTS);
  const [editMode, setEditMode] = useState(false);

  // persist state to disk via host
  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setEditMode(true);
      if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const set = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  useEffect(() => {
    document.documentElement.style.setProperty('--maxw', tweaks.density === 'compacto' ? '1080px' : '1240px');
    document.documentElement.style.setProperty('--uj-warm', tweaks.accentWarm ? '#B8811C' : 'transparent');
    const id = setTimeout(() => window.lucide && window.lucide.createIcons(), 30);
    return () => clearTimeout(id);
  });

  // Scroll reveal — only enable JS-driven fade-in if IO is supported
  useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    document.documentElement.classList.add('js-reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    requestAnimationFrame(() => {
      document.querySelectorAll('.reveal').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight) el.classList.add('is-in');
        else io.observe(el);
      });
    });
    return () => io.disconnect();
  }, [tweaks.variant]);

  const Hero = tweaks.variant === 'acompany' ? HeroAccompany
             : tweaks.variant === 'data' ? HeroData
             : HeroEditorialUJ;

  return (
    <>
      <HeaderUJ variant={tweaks.variant} />
      <main>
        <Hero tweaks={tweaks} />
        <QueHacer tweaks={tweaks} />
        <Pillars tweaks={tweaks} />
        <Observatorio tweaks={tweaks} />
        {tweaks.portraits && <Testimonios tweaks={tweaks} />}
        <Trayectoria tweaks={tweaks} />
        <Donar tweaks={tweaks} />
      </main>
      <FooterUJ />
      {editMode && <TweaksUJ tweaks={tweaks} set={set} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
