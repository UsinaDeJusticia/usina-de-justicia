<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8px base · 4 → 96" viewport="700x200" --><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#fff;font-family:var(--font-body);}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:end;}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{background:var(--uj-navy-600);width:100%;border-radius:3px;}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-2);}
.name{font-size:11px;font-weight:700;}
.title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--uj-navy-600);margin:0 0 16px;}
</style></head><body>
<div class="title">Spacing · 8px base</div>
<div class="grid">
  <div class="col"><div class="bar" style="height:4px"></div><div class="name">1</div><div class="lbl">4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="name">2</div><div class="lbl">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="name">3</div><div class="lbl">12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="name">4</div><div class="lbl">16</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="name">5</div><div class="lbl">24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="name">6</div><div class="lbl">32</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="name">7</div><div class="lbl">48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="name">8</div><div class="lbl">64</div></div>
  <div class="col"><div class="bar" style="height:96px"></div><div class="name">9</div><div class="lbl">96</div></div>
</div>
</body></html>
