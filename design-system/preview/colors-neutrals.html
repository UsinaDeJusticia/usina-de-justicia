<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Grey scale from logo U — #A7A9AD base" viewport="700x260" --><html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:#fff;font-family:var(--font-body);}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .sw{border-radius:8px;overflow:hidden;border:1px solid var(--border-1);}
  .chip{height:70px;}
  .meta{padding:8px 10px;}
  .name{font-weight:700;font-size:12px;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:2px;}
  .title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--uj-navy-600);margin:0 0 10px;}
</style></head><body>
<div class="title">Grey — neutrals (from logo U)</div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#1F2124"></div><div class="meta"><div class="name" style="color:#1F2124">grey-900</div><div class="hex">#1F2124</div></div></div>
  <div class="sw"><div class="chip" style="background:#3A3D42"></div><div class="meta"><div class="name">grey-800</div><div class="hex">#3A3D42</div></div></div>
  <div class="sw"><div class="chip" style="background:#5A5D63"></div><div class="meta"><div class="name">grey-700</div><div class="hex">#5A5D63</div></div></div>
  <div class="sw"><div class="chip" style="background:#7A7D82"></div><div class="meta"><div class="name">grey-600</div><div class="hex">#7A7D82</div></div></div>
  <div class="sw"><div class="chip" style="background:#A7A9AD;outline:2px solid #A7A9AD;outline-offset:-2px;"></div><div class="meta"><div class="name">grey-500 · base</div><div class="hex">#A7A9AD</div></div></div>
  <div class="sw"><div class="chip" style="background:#C4C6CA"></div><div class="meta"><div class="name">grey-400</div><div class="hex">#C4C6CA</div></div></div>
</div>
<div class="row" style="margin-top:10px;">
  <div class="sw"><div class="chip" style="background:#DADBDE"></div><div class="meta"><div class="name">grey-300</div><div class="hex">#DADBDE</div></div></div>
  <div class="sw"><div class="chip" style="background:#E5E6E8"></div><div class="meta"><div class="name">grey-200</div><div class="hex">#E5E6E8</div></div></div>
  <div class="sw"><div class="chip" style="background:#EFEFF1"></div><div class="meta"><div class="name">grey-100</div><div class="hex">#EFEFF1</div></div></div>
  <div class="sw"><div class="chip" style="background:#F7F7F8"></div><div class="meta"><div class="name">grey-50</div><div class="hex">#F7F7F8</div></div></div>
  <div class="sw"><div class="chip" style="background:#101B2A"></div><div class="meta"><div class="name">ink (body)</div><div class="hex">#101B2A</div></div></div>
  <div class="sw"><div class="chip" style="background:#E5E5E8"></div><div class="meta"><div class="name">border-1</div><div class="hex">#E5E5E8</div></div></div>
</div>
</body></html>
