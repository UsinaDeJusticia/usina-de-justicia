<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, danger — sm/md/lg" viewport="700x240" --><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:22px;background:#fff;font-family:var(--font-body);font-size:14px;}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;}
.btn{font-family:var(--font-body);font-weight:700;font-size:14px;padding:10px 18px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:all var(--dur-base) var(--ease-out);display:inline-flex;align-items:center;gap:8px;line-height:1;}
.btn-primary{background:var(--uj-navy-600);color:#fff;}
.btn-primary:hover{background:var(--uj-navy-800);}
.btn-secondary{background:#fff;color:var(--uj-navy-600);border-color:var(--uj-navy-600);}
.btn-secondary:hover{background:var(--uj-navy-50);}
.btn-ghost{background:transparent;color:var(--uj-navy-600);}
.btn-ghost:hover{background:var(--uj-navy-50);}
.btn-danger{background:var(--uj-danger);color:#fff;}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:6px;}
.btn-lg{padding:14px 24px;font-size:16px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.label{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;width:80px;}
</style></head><body>
<div class="row"><div class="label">primary</div>
  <button class="btn btn-primary">Quiero donar</button>
  <button class="btn btn-primary btn-sm">Guardar</button>
  <button class="btn btn-primary btn-lg">Ingresar caso</button>
  <button class="btn btn-primary" disabled>Enviando…</button>
</div>
<div class="row"><div class="label">secondary</div>
  <button class="btn btn-secondary">Ver expediente</button>
  <button class="btn btn-secondary btn-sm">Cancelar</button>
</div>
<div class="row"><div class="label">ghost</div>
  <button class="btn btn-ghost">Leer más</button>
  <button class="btn btn-ghost btn-sm">Omitir</button>
</div>
<div class="row"><div class="label">danger</div>
  <button class="btn btn-danger">Eliminar registro</button>
</div>
</body></html>
