<!doctype html>
<!-- @dsCard group="Colors" name="Navy palette" subtitle="Primary navy scale — #1D437D base" viewport="700x260" --><html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px;background:#fff;font-family:var(--font-body);}
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .sw{border-radius:8px;overflow:hidden;border:1px solid var(--border-1);}
  .chip{height:80px;}
  .meta{padding:8px 10px;}
  .name{font-weight:700;font-size:12px;color:var(--fg-1);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:2px;}
  .title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--uj-navy-600);margin:0 0 10px;}
</style></head><body>
<div class="title">Navy — primary</div>
<div class="row" style="margin-bottom:18px;">
  <div class="sw"><div class="chip" style="background:#0E2550"></div><div class="meta"><div class="name">navy-900</div><div class="hex">#0E2550</div></div></div>
  <div class="sw"><div class="chip" style="background:#102A52"></div><div class="meta"><div class="name">navy-800</div><div class="hex">#102A52</div></div></div>
  <div class="sw"><div class="chip" style="background:#163564"></div><div class="meta"><div class="name">navy-700</div><div class="hex">#163564</div></div></div>
  <div class="sw"><div class="chip" style="background:#1D437D;outline:2px solid #1D437D;outline-offset:-2px;"></div><div class="meta"><div class="name">navy-600 · brand</div><div class="hex">#1D437D</div></div></div>
  <div class="sw"><div class="chip" style="background:#2E5695"></div><div class="meta"><div class="name">navy-500</div><div class="hex">#2E5695</div></div></div>
  <div class="sw"><div class="chip" style="background:#5B7BB0"></div><div class="meta"><div class="name">navy-400</div><div class="hex">#5B7BB0</div></div></div>
</div>
<div class="row">
  <div class="sw"><div class="chip" style="background:#8FA6CB"></div><div class="meta"><div class="name">navy-300</div><div class="hex">#8FA6CB</div></div></div>
  <div class="sw"><div class="chip" style="background:#C3D0E3"></div><div class="meta"><div class="name">navy-200</div><div class="hex">#C3D0E3</div></div></div>
  <div class="sw"><div class="chip" style="background:#E4EAF3"></div><div class="meta"><div class="name">navy-100</div><div class="hex">#E4EAF3</div></div></div>
  <div class="sw"><div class="chip" style="background:#F3F6FB"></div><div class="meta"><div class="name">navy-50</div><div class="hex">#F3F6FB</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid var(--border-1);"></div><div class="meta"><div class="name">white</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAF8F5"></div><div class="meta"><div class="name">ivory</div><div class="hex">#FAF8F5</div></div></div>
</div>
</body></html>
