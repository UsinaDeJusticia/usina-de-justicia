<!doctype html>
<!-- @dsCard group="Spacing" name="Radii & elevation" subtitle="xs/sm/md/lg radii · flat/sm/md/lg shadows" viewport="700x380" --><html><head><meta charset="utf-8"><title>Radii & elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:22px;background:#fff;font-family:var(--font-body);}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.card{background:#fff;border:1px solid var(--border-1);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;height:110px;justify-content:center;}
.block{width:56px;height:56px;background:var(--uj-navy-100);border:1px solid var(--uj-navy-300);}
.lbl{font-size:12px;color:var(--fg-2);font-family:var(--font-mono);}
.ttl{font-size:12px;font-weight:700;}
.title{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--uj-navy-600);margin:0 0 12px;}
.elev{background:#fff;padding:18px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:8px;}
</style></head><body>
<div class="title">Corner radii</div>
<div class="row">
  <div class="card"><div class="block" style="border-radius:3px"></div><div class="ttl">xs · 3</div><div class="lbl">--radius-xs</div></div>
  <div class="card"><div class="block" style="border-radius:4px"></div><div class="ttl">sm · 4 · inputs</div><div class="lbl">--radius-sm</div></div>
  <div class="card"><div class="block" style="border-radius:8px"></div><div class="ttl">md · 8 · cards/btns</div><div class="lbl">--radius-md</div></div>
  <div class="card"><div class="block" style="border-radius:12px"></div><div class="ttl">lg · 12 · modals</div><div class="lbl">--radius-lg</div></div>
</div>
<div class="title">Elevation</div>
<div class="row" style="background:var(--uj-grey-50);padding:20px;border-radius:8px;">
  <div class="elev" style="box-shadow:none;border:1px solid var(--border-1);"><div class="ttl">flat</div><div class="lbl">borde 1px</div></div>
  <div class="elev" style="box-shadow:var(--shadow-sm);"><div class="ttl">sm</div><div class="lbl">cards, inputs</div></div>
  <div class="elev" style="box-shadow:var(--shadow-md);"><div class="ttl">md</div><div class="lbl">menús, modales</div></div>
  <div class="elev" style="box-shadow:var(--shadow-lg);"><div class="ttl">lg</div><div class="lbl">overlays</div></div>
</div>
</body></html>
